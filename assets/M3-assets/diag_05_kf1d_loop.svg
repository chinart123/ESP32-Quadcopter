<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 2L8 5L1 8" fill="none" stroke="#888780" stroke-width="1.8" stroke-linecap="round"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 2L8 5L1 8" fill="none" stroke="#C0504D" stroke-width="1.8" stroke-linecap="round"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 2L8 5L1 8" fill="none" stroke="#4472C4" stroke-width="1.8" stroke-linecap="round"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 2L8 5L1 8" fill="none" stroke="#E26B0A" stroke-width="1.8" stroke-linecap="round"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 2L8 5L1 8" fill="none" stroke="#4A9A4A" stroke-width="1.8" stroke-linecap="round"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 2L8 5L1 8" fill="none" stroke="#7B52AB" stroke-width="1.8" stroke-linecap="round"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 2L8 5L1 8" fill="none" stroke="#0F6E56" stroke-width="1.8" stroke-linecap="round"/></marker>
  </defs>
  <rect width="900" height="400" fill="white"/>
  <rect x="0" y="0" width="900" height="30" fill="#EEF3FF"/>
  <line x1="0" y1="30" x2="900" y2="30" stroke="#B0C0E8" stroke-width="0.8"/>
  <text x="450" y="21" text-anchor="middle" font-size="13" font-weight="700" fill="#2C3E6B">KF 1D — Full Algorithm Loop — Section 8</text>

  <!-- INITIALIZE Step 0 (top-left, red) -->
  <ellipse cx="88" cy="52" rx="36" ry="14" fill="#333"/>
  <text x="88" y="57" text-anchor="middle" font-size="10" font-weight="700" fill="white">Step 0</text>
  <rect x="18" y="64" width="140" height="108" rx="14" fill="#F2DCDB" stroke="#C0504D" stroke-width="2"/>
  <text x="88" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#C0504D">INITIALIZE</text>
  <text x="88" y="104" text-anchor="middle" font-size="10" fill="#444">Input:</text>
  <text x="88" y="120" text-anchor="middle" font-size="10" fill="#7F3131">System State</text>
  <text x="88" y="136" text-anchor="middle" font-size="10" fill="#7F3131">Initial Guess</text>
  <text x="88" y="154" text-anchor="middle" font-size="10" fill="#888" font-style="italic">x(0,0), p(0,0)</text>

  <!-- PREDICT Step 3 (top-center, orange) -->
  <ellipse cx="390" cy="52" rx="36" ry="14" fill="#333"/>
  <text x="390" y="57" text-anchor="middle" font-size="10" font-weight="700" fill="white">Step 3</text>
  <rect x="278" y="64" width="224" height="122" rx="14" fill="#FDE9D9" stroke="#E26B0A" stroke-width="2"/>
  <text x="390" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#333">PREDICT</text>
  <text x="390" y="104" text-anchor="middle" font-size="10" fill="#444">State Extrapolation:</text>
  <text x="390" y="120" text-anchor="middle" font-size="10" fill="#333" font-style="italic">x(n+1,n) = x(n,n)</text>
  <text x="390" y="138" text-anchor="middle" font-size="10" fill="#444">Covariance Extrapolation:</text>
  <text x="390" y="156" text-anchor="middle" font-size="10" fill="#333" font-style="italic">p(n+1,n) = p(n,n) + Q</text>
  <text x="390" y="176" text-anchor="middle" font-size="10" fill="#888" font-style="italic">x(0,0), p(0,0) = init</text>

  <!-- Unit Delay (far right, dashed) -->
  <rect x="570" y="40" width="126" height="48" rx="10" fill="#F2F2F2" stroke="#AAAAAA" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="633" y="61" text-anchor="middle" font-size="12" font-weight="600" fill="#444">Unit Delay</text>
  <text x="633" y="78" text-anchor="middle" font-size="11" fill="#666">n → n-1</text>

  <!-- MEASURE Step 1 (right, green) -->
  <ellipse cx="766" cy="192" rx="36" ry="14" fill="#333"/>
  <text x="766" y="197" text-anchor="middle" font-size="10" font-weight="700" fill="white">Step 1</text>
  <rect x="700" y="206" width="130" height="52" rx="14" fill="#D8E4BC" stroke="#76923C" stroke-width="2"/>
  <text x="765" y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#375623">MEASURE</text>
  <text x="765" y="246" text-anchor="middle" font-size="10" fill="#375623">Input: z(n)</text>

  <!-- UPDATE Step 2 (bottom-center, blue) -->
  <ellipse cx="285" cy="210" rx="36" ry="14" fill="#333"/>
  <text x="285" y="215" text-anchor="middle" font-size="10" font-weight="700" fill="white">Step 2</text>
  <rect x="278" y="222" width="224" height="120" rx="16" fill="#C5D9F1" stroke="#4472C4" stroke-width="2"/>
  <text x="390" y="242" text-anchor="middle" font-size="11" font-weight="700" fill="#17375E">UPDATE</text>
  <rect x="290" y="248" width="200" height="84" rx="10" fill="#4472C4"/>
  <text x="390" y="268" text-anchor="middle" font-size="9.5" fill="white">K(n) = p(n,n-1)/(p(n,n-1)+r)</text>
  <text x="390" y="285" text-anchor="middle" font-size="9.5" fill="white">x(n,n) = x(n,n-1)</text>
  <text x="390" y="299" text-anchor="middle" font-size="9.5" fill="white">     + K(n)*(z(n)-x(n,n-1))</text>
  <text x="390" y="316" text-anchor="middle" font-size="9.5" fill="white">p(n,n) = (1-K(n))*p(n,n-1)</text>

  <!-- Output (bottom-left) -->
  <rect x="40" y="240" width="170" height="36" rx="10" fill="#F2F2F2" stroke="#AAAAAA" stroke-width="1"/>
  <text x="125" y="255" text-anchor="middle" font-size="10" fill="#333">Output:</text>
  <text x="125" y="269" text-anchor="middle" font-size="10" fill="#555" font-style="italic">x(n,n),  p(n,n)</text>

  <!-- ARROWS -->
  <!-- INITIALIZE dashed → PREDICT (x(0,0)) -->
  <line x1="158" y1="118" x2="276" y2="118" stroke="#C0504D" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="217" y="111" text-anchor="middle" font-size="9" fill="#C0504D" font-style="italic">x(0,0)</text>

  <!-- PREDICT → Unit Delay -->
  <path d="M502 106 L545 106 L545 64 L568 64" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Unit Delay → bottom loop → UPDATE -->
  <path d="M568 64 L220 64 L220 216 L276 216" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="130" y="57" text-anchor="middle" font-size="9" fill="#555" font-style="italic">x(n,n-1), p(n,n-1)</text>

  <!-- MEASURE → UPDATE z(n) -->
  <line x1="700" y1="232" x2="545" y2="258" stroke="#4A9A4A" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="634" y="243" text-anchor="middle" font-size="9" fill="#4A9A4A" font-style="italic">z(n)</text>

  <!-- UPDATE → PREDICT x(n,n) -->
  <path d="M390 222 L390 186" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="408" y="208" font-size="9" fill="#555" font-style="italic">x(n,n)</text>

  <!-- UPDATE → Output -->
  <line x1="278" y1="258" x2="212" y2="258" stroke="#4472C4" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- Caption -->
  <rect x="10" y="365" width="880" height="28" rx="4" fill="#FFF9F0" stroke="#CCAA55" stroke-width="0.8"/>
  <text x="450" y="376" text-anchor="middle" font-size="10" fill="#7A5C00">Legend: x(n,n-1) = predicted state | p(n,n-1) = predicted uncertainty | r = measurement noise variance | Q = process noise</text>
  <text x="450" y="390" text-anchor="middle" font-size="10" fill="#7A5C00">K(n) adapts every step: large p → trust measurement; small p → trust model</text>
</svg>