<svg width="860" height="525" viewBox="0 0 860 525" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 2L8 5L1 8" fill="none" stroke="#4472C4" stroke-width="1.8" stroke-linecap="round"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 2L8 5L1 8" fill="none" stroke="#C0504D" stroke-width="1.8" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="525" fill="white"/>

  <!-- ─── FIX #7: TITLE BAR ─── -->
  <rect x="0" y="0" width="860" height="40" fill="#EEF3FF"/>
  <line x1="0" y1="40" x2="860" y2="40" stroke="#B0C0E8" stroke-width="1"/>
  <text x="430" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#2C3E6B">Kalman Filter — Simple Model vs Real World</text>

  <!-- ══════════════════════════════════════════
       SIMPLE MODEL  (y shifted +40 for title)
       Section: y=50 → y=205
  ══════════════════════════════════════════ -->
  <rect x="10" y="50" width="840" height="155" rx="12" fill="#DDEEFF" stroke="#4472C4" stroke-width="1.5" stroke-dasharray="6 3"/>
  <circle cx="32" cy="68" r="10" fill="#4472C4"/>
  <text x="46" y="73" font-size="13" font-weight="700" fill="#4472C4">Simple Model</text>

  <!-- FIX #4: Input boxes recentered — midpoint of centers (105+163)/2 = 134 = algorithm center -->
  <rect x="30" y="83" width="150" height="44" rx="8" fill="white" stroke="#4472C4" stroke-width="1.5"/>
  <text x="105" y="110" text-anchor="middle" font-size="12" fill="#333">Measurement</text>

  <rect x="30" y="141" width="150" height="44" rx="8" fill="white" stroke="#4472C4" stroke-width="1.5"/>
  <text x="105" y="168" text-anchor="middle" font-size="12" fill="#333">Dynamic Model</text>

  <!-- FIX #6: height=68 (consistent with Real World) -->
  <rect x="305" y="100" width="210" height="68" rx="10" fill="#B8D0F0" stroke="#4472C4" stroke-width="1.5"/>
  <text x="410" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#17375E">State Estimation</text>
  <text x="410" y="151" text-anchor="middle" font-size="13" font-weight="600" fill="#17375E">Algorithm</text>

  <!-- Output boxes -->
  <rect x="638" y="90" width="202" height="38" rx="8" fill="white" stroke="#4472C4" stroke-width="1.5"/>
  <text x="739" y="114" text-anchor="middle" font-size="12" fill="#333">Current State Estimate</text>

  <rect x="638" y="142" width="202" height="38" rx="8" fill="white" stroke="#4472C4" stroke-width="1.5"/>
  <text x="739" y="166" text-anchor="middle" font-size="12" fill="#333">Future State Prediction</text>

  <!-- Arrows (symmetric after Fix #4) -->
  <!-- Measurement center y=105 → alg. entry y=123 -->
  <line x1="180" y1="105" x2="303" y2="123" stroke="#4472C4" stroke-width="1.5" marker-end="url(#ab)"/>
  <!-- Dynamic Model center y=163 → alg. entry y=145 -->
  <line x1="180" y1="163" x2="303" y2="145" stroke="#4472C4" stroke-width="1.5" marker-end="url(#ab)"/>
  <!-- Alg. exit y=123 → Output box 1 center y=109 -->
  <line x1="515" y1="123" x2="636" y2="109" stroke="#4472C4" stroke-width="1.5" marker-end="url(#ab)"/>
  <!-- Alg. exit y=145 → Output box 2 center y=161 -->
  <line x1="515" y1="145" x2="636" y2="161" stroke="#4472C4" stroke-width="1.5" marker-end="url(#ab)"/>


  <!-- ══════════════════════════════════════════
       REAL WORLD  (y shifted +40 for title)
       Section: y=215 → y=460
  ══════════════════════════════════════════ -->
  <rect x="10" y="215" width="840" height="245" rx="12" fill="#FFE8E8" stroke="#C0504D" stroke-width="1.5" stroke-dasharray="6 3"/>
  <circle cx="32" cy="233" r="10" fill="#C0504D"/>
  <!-- FIX #6: "Real World (Complex)" instead of "Real World Complex" -->
  <text x="46" y="238" font-size="13" font-weight="700" fill="#C0504D">Real World (Complex)</text>

  <!-- Left input boxes -->
  <!-- Actual State: center y=277 -->
  <rect x="30" y="258" width="140" height="38" rx="8" fill="white" stroke="#C0504D" stroke-width="1.5"/>
  <text x="100" y="282" text-anchor="middle" font-size="12" fill="#333">Actual State</text>

  <!-- Measurement Noise: center y=329 (same as + circle and Algorithm center) -->
  <rect x="30" y="310" width="140" height="38" rx="8" fill="white" stroke="#C0504D" stroke-width="1.5"/>
  <text x="100" y="334" text-anchor="middle" font-size="12" fill="#333">Measurement Noise</text>

  <!-- Process Noise: center y=381 -->
  <rect x="30" y="362" width="140" height="38" rx="8" fill="white" stroke="#C0504D" stroke-width="1.5"/>
  <text x="100" y="386" text-anchor="middle" font-size="12" fill="#333">Process Noise</text>

  <!-- Summation circle: cy=329 (aligned with Measurement Noise center) -->
  <circle cx="230" cy="329" r="18" fill="white" stroke="#C0504D" stroke-width="1.5"/>
  <text x="230" y="336" text-anchor="middle" font-size="18" font-weight="600" fill="#C0504D">+</text>

  <!-- FIX #6: height=68 consistent with Simple Model. Center y=295+34=329 = + circle -->
  <rect x="390" y="295" width="210" height="68" rx="10" fill="#F4AAAA" stroke="#C0504D" stroke-width="1.5"/>
  <text x="495" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#7F1111">State Estimation</text>
  <text x="495" y="347" text-anchor="middle" font-size="13" font-weight="600" fill="#7F1111">Algorithm</text>

  <!-- FIX #5: Output boxes, font-size=12 (was 11) -->
  <!-- Box 1: y=250, center y=268 -->
  <rect x="638" y="250" width="202" height="36" rx="8" fill="white" stroke="#C0504D" stroke-width="1.5"/>
  <text x="739" y="273" text-anchor="middle" font-size="12" fill="#333">Current State Estimate</text>

  <!-- Box 2: y=296, center y=314 -->
  <rect x="638" y="296" width="202" height="36" rx="8" fill="white" stroke="#C0504D" stroke-width="1.5"/>
  <text x="739" y="319" text-anchor="middle" font-size="12" fill="#333">Estimate Uncertainty</text>

  <!-- Box 3: y=342, center y=360 -->
  <rect x="638" y="342" width="202" height="36" rx="8" fill="white" stroke="#C0504D" stroke-width="1.5"/>
  <text x="739" y="365" text-anchor="middle" font-size="12" fill="#333">Future State Prediction</text>

  <!-- Box 4: y=388, center y=406 -->
  <rect x="638" y="388" width="202" height="36" rx="8" fill="white" stroke="#C0504D" stroke-width="1.5"/>
  <text x="739" y="411" text-anchor="middle" font-size="12" fill="#333">Prediction Uncertainty</text>

  <!-- ── Left-side arrows ── -->
  <!-- Actual State (170,277) → + circle perimeter ~(216,317) -->
  <line x1="170" y1="277" x2="216" y2="317" stroke="#C0504D" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="179" y="293" font-size="11" fill="#C0504D" font-style="italic">x</text>

  <!-- FIX #4 partial: Measurement Noise (170,329) → + circle left perimeter (212,329) + labeled v(n) -->
  <line x1="170" y1="329" x2="212" y2="329" stroke="#C0504D" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="183" y="323" font-size="11" fill="#C0504D" font-style="italic">v(n)</text>

  <!-- FIX #1: z(n) label ON the arrow from + circle → Algorithm, NOT floating above circle -->
  <line x1="248" y1="329" x2="388" y2="329" stroke="#C0504D" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="318" y="321" text-anchor="middle" font-size="12" fill="#C0504D" font-style="italic" font-weight="700">z(n)</text>

  <!-- FIX #2: Process Noise → Algorithm with DASHED stroke + w(n) label to explain separate path -->
  <line x1="170" y1="381" x2="388" y2="354" stroke="#C0504D" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="278" y="362" text-anchor="middle" font-size="11" fill="#C0504D" font-style="italic">w(n)</text>

  <!-- FIX #3: Output arrows — evenly distributed from algorithm right edge (x=600, y=295–363) -->
  <!-- Start y values: 304, 321, 338, 355 (quarter centers of height=68) -->
  <!-- End y values:   268, 314, 360, 406 (box centers) — order preserved, NO crossings -->
  <line x1="600" y1="304" x2="636" y2="268" stroke="#C0504D" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="600" y1="321" x2="636" y2="314" stroke="#C0504D" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="600" y1="338" x2="636" y2="360" stroke="#C0504D" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="600" y1="355" x2="636" y2="406" stroke="#C0504D" stroke-width="1.5" marker-end="url(#ar)"/>


  <!-- ─── LEGEND ─── -->
  <rect x="10" y="473" width="840" height="48" rx="8" fill="#FFF9F0" stroke="#CCAA55" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="22" y="492" font-size="12" font-weight="700" fill="#7A5C00">Legend:</text>
  <text x="90" y="492" font-size="12" fill="#333">z(n) = x + v(n)    [Measurement = True State + Measurement Noise]</text>
  <text x="90" y="511" font-size="11" fill="#555">x = true state (unobservable)   |   v(n) = measurement noise   |   w(n) = process noise</text>
  <!-- Dashed indicator for w(n) path -->
  <line x1="594" y1="511" x2="620" y2="511" stroke="#C0504D" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="626" y="515" font-size="11" fill="#555">= enters state model separately</text>
</svg>
