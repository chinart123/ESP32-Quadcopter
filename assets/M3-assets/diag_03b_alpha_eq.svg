<svg width="900" height="380" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 2L8 5L1 8" fill="none" stroke="#555"    stroke-width="1.8" stroke-linecap="round"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 2L8 5L1 8" fill="none" stroke="#C0504D" stroke-width="1.8" stroke-linecap="round"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 2L8 5L1 8" fill="none" stroke="#4472C4" stroke-width="1.8" stroke-linecap="round"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 2L8 5L1 8" fill="none" stroke="#E26B0A" stroke-width="1.8" stroke-linecap="round"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 2L8 5L1 8" fill="none" stroke="#4A9A4A" stroke-width="1.8" stroke-linecap="round"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 2L8 5L1 8" fill="none" stroke="#7B52AB" stroke-width="1.8" stroke-linecap="round"/></marker>
    <marker id="ag2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 2L8 5L1 8" fill="none" stroke="#888780" stroke-width="1.8" stroke-linecap="round"/></marker>
  </defs>
  <rect width="900" height="380" fill="white"/>
  <rect x="0" y="0" width="900" height="30" fill="#EEF3FF"/>
  <line x1="0" y1="30" x2="900" y2="30" stroke="#B0C0E8" stroke-width="0.8"/>
  <text x="450" y="21" text-anchor="middle" font-size="13" font-weight="700" fill="#2C3E6B">α Filter — Estimation Algorithm (Equations) — Section 4</text>
  <text x="148" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="#375623">MEASURE</text>
  <ellipse cx="230" cy="48" rx="32" ry="13" fill="#333"/>
  <text x="230" y="53" text-anchor="middle" font-size="10" font-weight="700" fill="white">Step 1</text>
  <rect x="50" y="60" width="196" height="76" rx="14" fill="#D8E4BC" stroke="#76923C" stroke-width="2"/>
  <text x="148" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#375623">Input:</text>
  <text x="148" y="100" text-anchor="middle" font-size="11" fill="#375623">Measured Value</text>
  <text x="148" y="116" text-anchor="middle" font-size="11" fill="#375623" font-style="italic">z(n)</text>
  <rect x="310" y="60" width="200" height="76" rx="14" fill="#E8D8F8" stroke="#7B52AB" stroke-width="2"/>
  <text x="410" y="84" text-anchor="middle" font-size="11" fill="#4A2D7A">Output:</text>
  <text x="410" y="100" text-anchor="middle" font-size="11" fill="#4A2D7A">System State Estimate</text>
  <text x="410" y="116" text-anchor="middle" font-size="11" fill="#4A2D7A" font-style="italic">x(n,n)</text>
  <text x="710" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="#C0504D">INITIALIZE</text>
  <ellipse cx="800" cy="48" rx="32" ry="13" fill="#333"/>
  <text x="800" y="53" text-anchor="middle" font-size="10" font-weight="700" fill="white">Step 0</text>
  <rect x="610" y="60" width="196" height="76" rx="14" fill="#F2DCDB" stroke="#C0504D" stroke-width="2"/>
  <text x="708" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#C0504D">Input:</text>
  <text x="708" y="100" text-anchor="middle" font-size="11" fill="#7F3131">System State</text>
  <text x="708" y="116" text-anchor="middle" font-size="11" fill="#7F3131">Initial Guess</text>
  <rect x="18" y="186" width="252" height="144" rx="14" fill="#C5D9F1" stroke="#4472C4" stroke-width="2"/>
  <text x="52" y="210" font-size="11" font-weight="700" fill="#17375E">UPDATE</text>
  <ellipse cx="138" cy="188" rx="32" ry="13" fill="#333"/>
  <text x="138" y="193" text-anchor="middle" font-size="10" font-weight="700" fill="white">Step 2</text>
  <rect x="30" y="200" width="228" height="120" rx="10" fill="#4472C4"/>
  <text x="144" y="224" text-anchor="middle" font-size="9.5" fill="white">Kalman Gain:  a = 1/n</text>
  <text x="144" y="248" text-anchor="middle" font-size="9.5" fill="white">Innovation:  inn = z(n) - x(n,n-1)</text>
  <text x="144" y="272" text-anchor="middle" font-size="9.5" fill="white">State Update:</text>
  <text x="144" y="296" text-anchor="middle" font-size="9.5" fill="white">x(n,n) = x(n,n-1) + a * inn</text>
  <rect x="490" y="186" width="296" height="144" rx="14" fill="#FDE9D9" stroke="#E26B0A" stroke-width="2"/>
  <text x="520" y="210" font-size="11" font-weight="700" fill="#974706">PREDICT</text>
  <ellipse cx="730" cy="188" rx="32" ry="13" fill="#333"/>
  <text x="730" y="193" text-anchor="middle" font-size="10" font-weight="700" fill="white">Step 3</text>
  <rect x="502" y="200" width="272" height="120" rx="10" fill="#E26B0A"/>
  <text x="638" y="224" text-anchor="middle" font-size="9.5" fill="white">State Extrapolation:</text>
  <text x="638" y="248" text-anchor="middle" font-size="9.5" fill="white">x(n+1,n) = x(n,n)</text>
  <text x="638" y="272" text-anchor="middle" font-size="9.5" fill="white">(static system: no velocity,</text>
  <text x="638" y="296" text-anchor="middle" font-size="9.5" fill="white">state does not change)</text>
  <rect x="800" y="206" width="82" height="86" rx="8" fill="#F2F2F2" stroke="#AAAAAA" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="841" y="240" text-anchor="middle" font-size="10" font-weight="600" fill="#555">Unit</text>
  <text x="841" y="254" text-anchor="middle" font-size="10" font-weight="600" fill="#555">Delay</text>
  <text x="841" y="270" text-anchor="middle" font-size="10" fill="#666">(n→n-1)</text>
  <text x="450" y="372" text-anchor="middle" font-size="11" fill="#666" font-style="italic">x(n,n-1)</text>
  <line x1="148" y1="136" x2="116" y2="184" stroke="#4A9A4A" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="108" y="162" text-anchor="end" font-size="11" fill="#375623" font-style="italic">z(n)</text>
  <line x1="270" y1="258" x2="488" y2="258" stroke="#4472C4" stroke-width="1.8" marker-end="url(#ab)"/>
  <text x="379" y="251" text-anchor="middle" font-size="10" fill="#17375E" font-style="italic">x(n,n)</text>
  <path d="M 410 258 L 410 178 L 410 138" fill="none" stroke="#7B52AB" stroke-width="1.8" marker-end="url(#av)"/>
  <line x1="708" y1="136" x2="678" y2="184" stroke="#C0504D" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="714" y="162" font-size="11" fill="#C0504D" font-style="italic">x(0,0)</text>
  <line x1="786" y1="258" x2="798" y2="258" stroke="#E26B0A" stroke-width="1.8" marker-end="url(#ao)"/>
  <text x="792" y="251" text-anchor="middle" font-size="9" fill="#974706" font-style="italic">x(n+1,n)</text>
  <path d="M841 292 L841 360 L138 360 L138 332" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="10" y="350" width="880" height="22" rx="4" fill="#FFF9F0" stroke="#CCAA55" stroke-width="0.8"/>
  <text x="450" y="366" text-anchor="middle" font-size="10" fill="#7A5C00" font-style="italic">Diagram B: a=1/n is the Kalman Gain for static system. a decreases → later measurements have less weight.</text>
</svg>